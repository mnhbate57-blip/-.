<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Эзэмшигчийн самбар</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,600&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/admin.css">
</head>
<body class="admin">
<main class="wrap adm-wrap">
  <header class="adm-head">
    <div>
      <span class="eyebrow">Сэтгэлийн шуудан</span>
      <h1>Эзэмшигчийн самбар</h1>
    </div>
    <button type="button" class="btn ghost" id="logout" hidden>Гарах</button>
  </header>

  <section id="login" class="panel adm-login">
    <h2>Нэвтрэх</h2>
    <p class="note">Зөвхөн эзэмшигч орно. Render дээрх <b>ADMIN_KEY</b> утгаа оруулна уу.</p>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="key">Нууц түлхүүр</label>
        <input type="password" id="key" autocomplete="current-password" spellcheck="false">
      </div>
      <div class="status" id="login-status" role="status"></div>
      <button type="submit" class="btn" id="login-btn">Нэвтрэх</button>
    </form>
  </section>

  <section id="dash" hidden>
    <div class="adm-stats" id="stats"></div>

    <div class="panel">
      <div class="adm-tools">
        <h2>Захиалгууд</h2>
        <div class="adm-filters">
          <input type="text" id="q" placeholder="Хэнд, хэнээс хайх…" aria-label="Хайх">
          <select id="f-plan" aria-label="Төрөл">
            <option value="">Бүх төрөл</option><option value="free">Үнэгүй</option><option value="premium">Premium</option>
          </select>
          <select id="f-status" aria-label="Төлөв">
            <option value="">Бүх төлөв</option><option value="paid">Төлсөн / бэлэн</option><option value="pending">Хүлээгдэж буй</option>
          </select>
          <button type="button" class="btn ghost" id="refresh">Шинэчлэх</button>
          <button type="button" class="btn ghost" id="csv">CSV татах</button>
        </div>
      </div>
      <div class="status" id="dash-status" role="status"></div>
      <div class="adm-table-wrap">
        <table class="adm-table">
          <thead><tr><th>Огноо</th><th>Хэнд</th><th>Хэнээс</th><th>Төрөл</th><th>Төлөв</th><th class="num">Дүн</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="note" id="count-note"></p>
    </div>
  </section>
</main>
<script src="/admin.js"></script>
</body>
</html>
